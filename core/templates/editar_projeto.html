
<html>
<head>
    <title>Editar Projeto</title>
</head>
<body>
    <h1>Editar Projeto</h1>

    <form method="POST">
        {% csrf_token %}

        Nome:
        {{ form.nome }}
        <br><br>

        Descrição:
        {{ form.descricao }}
        <br><br>

        Data:
        {{ form.data_inicio }}
        <br><br>

        <input type="submit" value="Salvar Alterações">
    </form>

    <a href="/projetos/">Voltar</a>
</body>
</html>
